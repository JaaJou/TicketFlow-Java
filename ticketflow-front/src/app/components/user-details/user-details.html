<div class="users-details-page">

  <header>
    <h2 class="users-details-title">User Details</h2>
    <hr>
  </header>

  @if (user(); as u) {
  <section>
    <form class="user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First name</label>
          <input type="text" class="form-control" id="firstName" formControlName="firstName">
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last name</label>
          <input type="text" class="form-control" id="lastName" formControlName="lastName">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" formControlName="email">
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone number</label>
          <input type="tel" class="form-control" id="phone" formControlName="phone">
        </div>
      </div>
      <div class="d-flex gap-2">
        @if (!isEdit) {
        <button type="button" class="btn btn-secondary" (click)="onClickEdit(true)">Edit</button>
        } @else {
        <button type="button" class="btn btn-outline-secondary" (click)="onClickEdit(false)">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Submit</button>
        }
      </div>
    </form>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" (click)="onClickDelete()">Delete User</button>
    </div>

  </section>
  }

</div>
