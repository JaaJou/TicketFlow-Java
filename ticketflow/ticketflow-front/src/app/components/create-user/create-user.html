<div class="users-create-page">

  <header>
    <h2 class="users-create-title">Create User</h2>
    <hr>
  </header>

  <section>
    <form class="user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">

      <div class="row mb-3">

        <div class="col-md-6">
          <label for="firstName" class="form-label">First name</label>
          <input type="text" class="form-control" id="firstName" formControlName="firstName">
        </div>

        <div class="col-md-6">
          <label for="lastName" class="form-label">Last name</label>
          <input type="text" class="form-control" id="lastName" formControlName="lastName">
        </div>

      </div>

      <div class="row mb-3">

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" formControlName="email">
        </div>

        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" formControlName="password">
        </div>

      </div>

      <div class="row mb-3">

        <div class="col-md-6">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" class="form-control" id="phone" formControlName="phone">
        </div>

        <div class="col-md-6">
          <label for="ppurl" class="form-label">Profil Picture</label>
          <input type="text" class="form-control" id="ppurl" formControlName="ppurl">
        </div>

      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Create user</button>
      </div>

    </form>
  </section>

</div>
