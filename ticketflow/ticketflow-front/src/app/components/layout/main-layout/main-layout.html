<div class="page-principal">
<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand text-main-title" routerLink="/">TicketFlow</a>

      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active"
               aria-current="page"
               routerLink="/"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{exact: true}"
            >
              Home
            </a>
          </li>

          @if(DisplayAdminElement()) {
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Users
              </a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" routerLink="/users">Browse Users</a></li>

                <li><hr class="dropdown-divider"></li>

                <li><a class="dropdown-item" routerLink="/users/new">Add a new User</a></li>
              </ul>
            </li>
          }

        </ul>

        <!-- Tout à droite -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <button class="nav-link btn btn-link" (click)="logout()">
              Logout
            </button>
          </li>
        </ul>

      </div>

    </div>
  </nav>
</header>


  <main class="page-container">
    <router-outlet />
  </main>

  <footer>
    <p>@ 2026 TicketFlow</p>
  </footer>
</div>
